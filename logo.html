<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI & ML Dept — 3D Coin Logo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: radial-gradient(ellipse at 50% 50%, #0c1520 0%, #020508 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }

    #wrap {
      position: relative;
      width: 560px;
      height: 560px
    }

    canvas {
      display: block
    }

    .glow {
      position: absolute;
      inset: -25px;
      border-radius: 50%;
      pointer-events: none;
      box-shadow:
        0 0 50px 12px rgba(255, 255, 255, 0.08),
        0 0 100px 30px rgba(200, 210, 255, 0.07),
        0 0 180px 60px rgba(150, 170, 255, 0.04);
      animation: pulse 3.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: .65;
        transform: scale(.97)
      }

      to {
        opacity: 1;
        transform: scale(1.02)
      }
    }

    .hint {
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: .25em;
      color: rgba(150, 180, 220, .35);
      text-transform: uppercase
    }
  </style>
</head>

<body>
  <div id="wrap">
    <div class="glow"></div>
    <canvas id="c"></canvas>
  </div>
  <div class="hint">Drag · Scroll to zoom</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    const W = 560, H = 560;
    const canvas = document.getElementById('c');
    canvas.width = W; canvas.height = H;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(W, H);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.8;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
    camera.position.set(0, 0, 7);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.9));

    const key = new THREE.DirectionalLight(0xffffff, 3.0);
    key.position.set(5, 8, 8); key.castShadow = true;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0xaaccff, 1.8);
    rim.position.set(-5, 3, -5);
    scene.add(rim);

    const fill = new THREE.PointLight(0xffffff, 1.5, 20);
    fill.position.set(0, 0, 7);
    scene.add(fill);

    const under = new THREE.PointLight(0x4466bb, 1.2, 15);
    under.position.set(0, -5, 3);
    scene.add(under);

    // Load the real logo as texture
    const img = new Image();

      const tex = new THREE.Texture(img);
      tex.needsUpdate = true;
      buildScene(tex);
      animate();

    function buildScene(logoTex) {
      const group = new THREE.Group();
      scene.add(group);
      group.userData.ref = group;
      scene.userData.mainGroup = group;

      // ── Coin base (thick disc) ──────────────────────────────────
      const discGeo = new THREE.CylinderGeometry(3.0, 3.0, 0.38, 128);
      const discMat = new THREE.MeshStandardMaterial({
        color: 0xd8dde6, metalness: 0.97, roughness: 0.04,
        envMapIntensity: 2
      });
      const disc = new THREE.Mesh(discGeo, discMat);
      disc.rotation.x = Math.PI / 2;
      disc.castShadow = true; disc.receiveShadow = true;
      group.add(disc);

      // ── Logo face (front) — circular plane with logo texture ────
      const faceGeo = new THREE.CircleGeometry(2.88, 128);
      const faceMat = new THREE.MeshStandardMaterial({
        map: logoTex,
        metalness: 0.15,
        roughness: 0.35,
        side: THREE.FrontSide
      });
      const face = new THREE.Mesh(faceGeo, faceMat);
      face.position.z = 0.20;
      group.add(face);

      // ── Back face — plain metallic ──────────────────────────────
      const backGeo = new THREE.CircleGeometry(2.88, 128);
      const backMat = new THREE.MeshStandardMaterial({
        color: 0xbbc4d0, metalness: 0.95, roughness: 0.06
      });
      const back = new THREE.Mesh(backGeo, backMat);
      back.position.z = -0.20;
      back.rotation.y = Math.PI;
      group.add(back);

      // ── Edge ring — polished chrome ─────────────────────────────
      const ringGeo = new THREE.TorusGeometry(2.99, 0.19, 32, 200);
      const ringMat = new THREE.MeshStandardMaterial({
        color: 0xe8edf5, metalness: 0.99, roughness: 0.02,
        envMapIntensity: 3
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.castShadow = true;
      group.add(ring);

      // ── Beveled inner edge ring ─────────────────────────────────
      const bevelGeo = new THREE.TorusGeometry(2.80, 0.04, 16, 200);
      const bevelMat = new THREE.MeshStandardMaterial({
        color: 0xccddee, metalness: 0.95, roughness: 0.05
      });
      group.add(new THREE.Mesh(bevelGeo, bevelMat));

      // ── Reeded edge knurling (coin mill lines) ──────────────────
      const knurlCount = 120;
      for (let i = 0; i < knurlCount; i++) {
        const angle = (i / knurlCount) * Math.PI * 2;
        const kGeo = new THREE.BoxGeometry(0.045, 0.42, 0.06);
        const kMat = new THREE.MeshStandardMaterial({
          color: 0xd0d8e5, metalness: 0.98, roughness: 0.03
        });
        const k = new THREE.Mesh(kGeo, kMat);
        k.position.set(Math.cos(angle) * 2.99, Math.sin(angle) * 2.99, 0);
        k.rotation.z = angle;
        group.add(k);
      }

      // ── Sparkle/reflection highlight on face ───────────────────
      const hlGeo = new THREE.CircleGeometry(1.1, 64);
      const hlMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, metalness: 0, roughness: 0,
        transparent: true, opacity: 0.07,
        side: THREE.FrontSide
      });
      const hl = new THREE.Mesh(hlGeo, hlMat);
      hl.position.set(-0.6, 0.6, 0.21);
      group.add(hl);

      // ── Particle orbit ──────────────────────────────────────────
      const pCount = 200;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 3.5 + Math.random() * 1.2;
        pPos[i * 3] = Math.cos(a) * r;
        pPos[i * 3 + 1] = Math.sin(a) * r;
        pPos[i * 3 + 2] = (Math.random() - 0.5) * 0.4;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const pMat = new THREE.PointsMaterial({ color: 0x99bbdd, size: 0.035, transparent: true, opacity: 0.6 });
      const particles = new THREE.Points(pGeo, pMat);
      group.add(particles);
      group.userData.particles = particles;
    }

    // Interaction
    let drag = false, prevX = 0, prevY = 0;
    let targetY = 0.3, targetX = 0.06;
    let rotX = 0.06, rotY = 0.3;
    let zoom = 7;

    canvas.addEventListener('mousedown', e => { drag = true; prevX = e.clientX; prevY = e.clientY });
    window.addEventListener('mouseup', () => drag = false);
    window.addEventListener('mousemove', e => {
      if (!drag) return;
      targetY += (e.clientX - prevX) * 0.009;
      targetX += (e.clientY - prevY) * 0.007;
      targetX = Math.max(-1.3, Math.min(1.3, targetX));
      prevX = e.clientX; prevY = e.clientY;
    });
    canvas.addEventListener('wheel', e => {
      zoom += e.deltaY * 0.007;
      zoom = Math.max(4.5, Math.min(13, zoom));
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchstart', e => { drag = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY });
    canvas.addEventListener('touchend', () => drag = false);
    canvas.addEventListener('touchmove', e => {
      if (!drag) return;
      targetY += (e.touches[0].clientX - prevX) * 0.009;
      targetX += (e.touches[0].clientY - prevY) * 0.007;
      prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
    });

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.01;

      if (!drag) targetY += 0.004;

      rotX += (targetX - rotX) * 0.07;
      rotY += (targetY - rotY) * 0.07;

      const g = scene.userData.mainGroup;
      if (g) {
        g.rotation.x = rotX;
        g.rotation.y = rotY;
        if (g.userData.particles)
          g.userData.particles.rotation.z = t * 0.04;
      }

      camera.position.z += (zoom - camera.position.z) * 0.08;

      // Animate fill light orbit for dynamic sheen
      fill.position.x = Math.sin(t * 0.35) * 3;
      fill.position.y = Math.cos(t * 0.28) * 3;
      fill.position.z = 5 + Math.sin(t * 0.5) * 2;

      renderer.render(scene, camera);
    }
  </script>
